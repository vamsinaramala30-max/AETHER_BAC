openapi: 3.1.0
info:
  title: AETHER Enterprise API Specification
  description: Official OpenAPI documentation for the AETHER platform backend.
  version: 1.0.0
servers:
  - url: http://localhost:5000/api/v1
    description: Local Development Server
paths:
  /health:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: System status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "UP"
                  timestamp:
                    type: string
                    format: date-time
                  uptime:
                    type: number
  /auth/login:
    post:
      summary: Authenticate user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Auth token payload
  /users/me:
    get:
      summary: Fetch current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
  /workspaces:
    get:
      summary: List user workspaces
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Workspaces list
  /projects:
    get:
      summary: List projects
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Projects list
  /ai/generate:
    post:
      summary: Submit AI generation task
      security:
        - bearerAuth: []
      responses:
        '200':
          description: AI generation output
  /knowledge:
    get:
      summary: Knowledge base query
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Vector query results
  /files/upload:
    post:
      summary: Upload files to storage
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Upload success confirmation
  /automation/workflows:
    get:
      summary: Automation workflows
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Workflows configuration
  /notifications:
    get:
      summary: Fetch user notifications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of notifications
  /analytics/overview:
    get:
      summary: Platform analytics summary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Analytics data
  /settings:
    get:
      summary: System preferences
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Application settings
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT